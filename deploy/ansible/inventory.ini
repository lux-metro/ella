[inventory]
# Lista de las Raspberry Pi de la instalación (una sola Pi)
# Formato: nombre_descriptivo ansible_host=IP_DE_LA_PI

ella ansible_host=192.168.1.100 ansible_user=pi

[todas:children]
inventory

[todas:vars]
# Variables globales para todas las Pi
ansible_python_interpreter=/usr/bin/python3
# Si tenés contraseña SSH para el usuario 'pi', agregala acá (no recomendado para repos públicos)
# ansible_ssh_pass=tu_contraseña
# Es preferible usar SSH keys (ssh-copy-id)
